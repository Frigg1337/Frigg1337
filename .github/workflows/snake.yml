name: Generate Snake

on:
  # Berjalan otomatis setiap 12 jam
  schedule:
    - cron: "0 */12 * * *" 
  
  # Bisa dijalankan manual
  workflow_dispatch:
  
  # Berjalan setiap ada push ke branch master/main
  push:
    branches:
    - master
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # OUTPUT: Versi Light (Biru) & Dark (Ungu)
          outputs: |
            # Versi Light (Jaga-jaga)
            dist/snake.svg?color_snake=#82AAFF&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            # Versi Dark (Blueberry Theme - Kotak kosong lebih terlihat)
            dist/snake-dark.svg?palette=github-dark&color_snake=#C792EA&color_dots=#222733,#344669,#47659F,#5B85D6,#82AAFF

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
